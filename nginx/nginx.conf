# Runs as the non-root nginx user (nginx-unprivileged image), so the pid file
# and temp paths must live somewhere that user can write.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Security headers. If your SSO provider is embedded in a frame, add its origin to frame-src.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Content-Security-Policy lives in its own file so docker-compose.dev.yml can
    # swap in a policy that allows next dev's eval'd scripts.
    include /etc/nginx/csp.conf;

    # HSTS only when a TLS-terminating proxy in front (e.g. Cloudflare) reports
    # the client used HTTPS; an empty value means nginx sends no header (VND-005).
    map $http_x_forwarded_proto $hsts_header {
        https   "max-age=31536000";
        default "";
    }
    add_header Strict-Transport-Security $hsts_header always;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=vendiant_api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
    
    # Upstream for the frontend
    upstream vendiant_frontend {
        server frontend:3005;
        keepalive 32;
    }
    
    # Upstream for the backend API
    upstream vendiant_backend {
        server backend:5005;
        keepalive 32;
    }
    
    # Upstream for the Vendiant API Layer
    upstream vendiant_api {
        server vendiant_api:5006;
        keepalive 32;
    }
    
    # HTTP server (redirects to HTTPS in production)
    server {
        listen 80;
        server_name _;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Redirect to HTTPS when a TLS-terminating proxy in front of nginx
        # reports the client connected over plain HTTP (VND-005). Direct local
        # access (no X-Forwarded-Proto) is unaffected. If nginx terminates TLS
        # itself, enable the 443 server block below and redirect unconditionally.
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        
        # For now, serve directly (development/testing)
        location / {
            proxy_pass http://vendiant_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Extended timeouts for long-running operations
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            
            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Vendiant API Layer routes - Handle external API requests
        location /vendiant/ {
            limit_req zone=vendiant_api burst=10 nodelay;
            
            proxy_pass http://vendiant_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Extended timeouts for API operations
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            
            # CORS is enforced by the API layer (CORSMiddleware with the explicit
            # CORS_ORIGINS allowlist). Do not add Access-Control-* headers here:
            # a wildcard would override that allowlist (VND-002), and any
            # add_header in this block drops the server-level security headers.
        }
        
        # NextAuth API routes - Handle authentication (must come before general /api/)
        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;
            
            proxy_pass http://vendiant_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Extended timeouts for auth operations
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            
            # Session cookie security
            proxy_cookie_flags ~ secure samesite=lax;
            
            # No CORS headers needed for same-origin auth routes
        }
        
        # API routes with rate limiting - Route through frontend for authentication
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://vendiant_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Extended timeouts for API calls
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            
            # Same-origin only. The Next.js proxy sets its own allowlisted
            # Access-Control-Allow-Origin (CORS_ACCESS_CONTROL_ALLOW_ORIGIN), so
            # no CORS headers here (VND-002).
        }
        
        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://vendiant_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache static assets
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(bak|old|orig|save|swp|tmp)$ {
            deny all;
            return 404;
        }
    }
    
    # HTTPS server (for production with SSL certificates)
    # Uncomment and configure when you have SSL certificates
    # server {
    #     listen 443 ssl http2;
    #     server_name your.domain.example;
    #     
    #     # SSL configuration
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     
    #     # SSL security settings
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     
    #     # HSTS and Security Headers for HTTPS
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header Referrer-Policy "no-referrer-when-downgrade" always;
    #     add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src 'self' https:; frame-src 'self'" always;
    #     
    #     # NextAuth API routes for HTTPS
    #     location /api/auth/ {
    #         limit_req zone=login burst=5 nodelay;
    #         
    #         proxy_pass http://vendiant_frontend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Forwarded-Host $host;
    #         proxy_set_header X-Forwarded-Port $server_port;
    #         
    #         # Extended timeouts for auth operations
    #         proxy_connect_timeout 300s;
    #         proxy_send_timeout 300s;
    #         proxy_read_timeout 300s;
    #         proxy_buffering off;
    #         
    #         # Enhanced session cookie security for HTTPS
    #         proxy_cookie_flags ~ secure httponly samesite=lax;
