# Development CSP, mounted by docker-compose.dev.yml. next dev needs
# 'unsafe-eval' for its scripts and ws: for live reload. Never use in production.
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: ws:; frame-src 'self'" always;
