# Content-Security-Policy (included at http level from nginx.conf).
# Dashboard pages get a per-request nonce-based CSP from the Next.js
# middleware (frontend/middleware.ts), so nginx must not send a second,
# looser one for them (VND-006). nginx only sets a CSP for the JSON API layer,
# which never serves HTML (its docs/OpenAPI routes are disabled).
# An empty value means nginx sends no header.
map $uri $vendiant_csp {
    ~^/vendiant/ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default      "";
}
add_header Content-Security-Policy $vendiant_csp always;
