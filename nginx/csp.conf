# Production Content-Security-Policy (included from nginx.conf).
# No http: sources (VND-006). 'unsafe-inline' remains for script/style because
# Next.js emits inline bootstrap scripts; removing it needs nonce-based CSP in
# frontend middleware (tracked under VND-006).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
